<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada</title>
  <meta name="robots" content="noindex" />
  <style>
    :root{--bg:#0b1119;--card:#111a26;--text:#e9eef7;--muted:#9eb0c7;--acc:#79b8ff;--border:rgba(158,176,199,.25)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#122136 0%,#0b1119 55%);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text)}
    .card{max-width:620px;margin:1rem;padding:2rem;border:1px solid var(--border);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));backdrop-filter:blur(8px)}
    h1{font-size:clamp(2rem,5vw,3rem);margin:.2rem 0 1rem;line-height:1.1}
    p{color:var(--muted);line-height:1.8;margin:0 0 1.2rem}
    a{display:inline-block;padding:.72rem 1.2rem;border-radius:999px;text-decoration:none;font-weight:700;background:#fff;color:#0d1624}
    a:hover{filter:brightness(.95)}
    .code{font:600 .8rem ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.06em;color:var(--acc)}
  </style>
</head>
<body>
  <main class="card">
    <div class="code">ERRO 404</div>
    <h1>Página não encontrada</h1>
    <p>O link que você acessou não existe ou foi movido. Volte para o portfólio principal para continuar navegando.</p>
    <a href="/">Voltar para a página inicial</a>
  </main>
</body>
</html>
